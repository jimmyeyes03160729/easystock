# Installed on the VM as /etc/systemd/system/easystock-market-update.service.d/95-retry-on-failure.conf (2026-10-08).
# Retry the daily market update 30 minutes after a failure (e.g. TPEx endpoint dropping the connection).
# At most 3 starts within 4 hours: the scheduled run plus two retries. Weekend ExecCondition skips are not failures.
[Unit]
StartLimitIntervalSec=4h
StartLimitBurst=3

[Service]
Restart=on-failure
RestartSec=30min
