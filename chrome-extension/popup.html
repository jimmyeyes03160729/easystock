<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockWatch Pro</title>
  <link rel="stylesheet" href="assets/popup.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased selection:bg-slate-200">
  <div class="w-[400px] max-h-[600px] h-[600px] flex flex-col bg-white border border-slate-200 shadow-xl overflow-hidden relative">

    <!-- 頂部列與搜尋 -->
    <header class="p-3 border-b border-slate-100 bg-white sticky top-0 z-10">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-2">
          <div id="market-status-dot" class="h-2 w-2 rounded-full bg-slate-400" title="離線 / 休市"></div>
          <h1 class="text-sm font-bold tracking-tight text-slate-900">StockWatch Pro</h1>
          <span id="vip-status-badge" class="hidden text-[10px] font-bold bg-amber-100 text-amber-700 px-1.5 py-0.5 rounded border border-amber-200">VIP</span>
        </div>
        <div class="flex items-center gap-2">
          <button id="btn-open-settings" aria-label="開啟設定" class="text-slate-400 hover:text-slate-600 transition">
            <i data-lucide="sliders-horizontal" class="w-4 h-4"></i>
          </button>
        </div>
      </div>
      <div class="flex items-center gap-1.5">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input id="input-search" aria-label="股票代號或名稱" type="text" placeholder="輸入台股代號 (例: 2330)..." class="w-full pl-8 pr-2 py-1 text-xs bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:border-slate-400" />
        </div>
        <button id="btn-add" class="h-7 px-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-md text-xs font-medium flex items-center gap-1">
          <i data-lucide="plus" class="w-3 h-3"></i> 新增
        </button>
      </div>
    </header>

    <!-- 群組切換 Tabs -->
    <nav id="group-tabs" class="flex px-3 py-1.5 border-b border-slate-100 gap-1 text-xs bg-slate-50/50">
      <button class="tab-btn px-2.5 py-1 rounded font-medium text-slate-900 bg-white border border-slate-200 shadow-xs" data-group="all">全部</button>
      <button class="tab-btn px-2.5 py-1 rounded font-medium text-slate-500 hover:text-slate-800" data-group="daytrade">當沖監控</button>
      <button class="tab-btn px-2.5 py-1 rounded font-medium text-slate-500 hover:text-slate-800" data-group="rebound">觸底反彈</button>
    </nav>

    <!-- 自選列表容器 -->
    <main id="stock-list-container" class="flex-1 overflow-y-auto no-scrollbar p-3 space-y-2">
      <!-- 動態插入卡片 -->
    </main>

    <!-- 底部狀態列 -->
    <footer class="px-3 py-2 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
      <span id="update-timestamp">狀態：就緒</span>
      <div class="flex items-center gap-2">
        <button id="btn-upgrade" class="text-amber-600" title="查看 VIP 方案">VIP</button>
        <button id="btn-refresh" class="hover:text-slate-600 transition" title="重新整理">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </footer>

    <!-- 設定面板 (Drawer) -->
    <div id="settings-panel" role="dialog" aria-label="擴充功能設定" aria-hidden="true" class="absolute inset-0 bg-white z-20 transform translate-x-full transition-transform duration-200 flex flex-col">
      <div class="p-3 border-b border-slate-100 flex items-center justify-between">
        <h2 class="text-xs font-bold text-slate-900">擴充功能設定</h2>
        <button id="btn-close-settings" aria-label="關閉設定" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-3 space-y-4 text-xs">
        <p id="action-message" role="status" aria-live="polite" class="text-[11px] text-slate-500"></p>
        <!-- 測試與推播專用區 (VM / 除錯用) -->
        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
          <h3 class="font-bold text-slate-800 mb-1 flex items-center gap-1">
            <i data-lucide="bell-ring" class="w-3.5 h-3.5 text-sky-600"></i>
            <span>原生推播測試 (Telegram 格式)</span>
          </h3>
          <p class="text-[10px] text-slate-500 mb-2">點擊發送系統通知，測試買進／賣出彈窗與音效設定。</p>
          <div class="grid grid-cols-2 gap-2 mb-2">
            <button id="btn-test-daytrade-notif" class="py-1 bg-sky-600 hover:bg-sky-700 text-white rounded text-[11px] font-medium transition">
              🚀 測試買進推播
            </button>
            <button id="btn-test-exit-notif" class="py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[11px] font-medium transition">
              ✅ 測試賣出推播
            </button>
          </div>
          <button id="btn-test-rebound-notif" class="w-full py-1 bg-purple-600 hover:bg-purple-700 text-white rounded text-[11px] font-medium transition">
            測試反彈推播
          </button>
        </div>

        <!-- 策略開關 -->
        <div>
          <h3 class="font-bold text-slate-700 mb-2">策略監控開關</h3>
          <div class="space-y-2">
            <label class="flex items-center justify-between">
              <div>
                <span>全市場當沖連動</span>
                <span class="block text-[10px] text-slate-400">開啟時自動推播全市場買賣部位</span>
              </div>
              <input type="checkbox" id="toggle-all-daytrade" class="rounded text-slate-900" />
            </label>
            <label class="flex items-center justify-between">
              <span>當沖突破監控</span>
              <input type="checkbox" id="toggle-daytrade" class="rounded text-slate-900" />
            </label>
            <label class="flex items-center justify-between">
              <span>觸底反彈訊號</span>
              <input type="checkbox" id="toggle-rebound" class="rounded text-slate-900" />
            </label>
          </div>
        </div>

        <!-- VIP 序號開通 -->
        <div class="border-t border-slate-100 pt-3">
          <h3 class="font-bold text-slate-700 mb-1 flex items-center gap-1">
            <span>VIP 會員認證</span>
            <span class="text-[10px] text-amber-600 bg-amber-50 px-1 rounded">解鎖推播無上限</span>
          </h3>
          <div class="flex gap-1 mt-2">
            <input type="text" id="input-vip-key" aria-label="VIP 授權碼" placeholder="輸入 VIP 啟用序號 (例: VIP888)" class="flex-1 px-2 py-1 bg-slate-50 border border-slate-200 rounded text-xs" />
            <button id="btn-activate-vip" class="px-2.5 py-1 bg-amber-600 hover:bg-amber-700 text-white rounded font-medium">開通</button>
          </div>
          <p id="vip-msg" class="text-[10px] text-slate-400 mt-1"></p>
        </div>

        <!-- 自選清單備份 -->
        <div class="border-t border-slate-100 pt-3">
          <h3 class="font-bold text-slate-700 mb-2">資料備份與還原</h3>
          <div class="flex gap-2">
            <button id="btn-export-stocks" class="flex-1 py-1 border border-slate-200 rounded hover:bg-slate-50">匯出 JSON</button>
            <button id="btn-import-stocks" class="flex-1 py-1 border border-slate-200 rounded hover:bg-slate-50">匯入 JSON</button>
            <input type="file" id="file-import" class="hidden" accept=".json" />
          </div>
        </div>
      </div>
    </div>

    <!-- VIP 方案與預留付款彈窗 (Modal) -->
    <div id="payment-modal" role="dialog" aria-modal="true" aria-label="VIP 升級方案" class="hidden absolute inset-0 bg-slate-900/40 backdrop-blur-xs z-30 flex items-center justify-center p-4">
      <div class="bg-white rounded-xl p-4 w-full shadow-2xl border border-slate-100">
        <div class="flex items-center justify-between mb-2">
          <div class="flex items-center gap-1 text-amber-600 font-bold text-sm">
            <i data-lucide="crown" class="w-4 h-4"></i> 升級 VIP 專業版
          </div>
          <button id="btn-close-payment" aria-label="關閉付款視窗" class="text-slate-400 hover:text-slate-600"><i data-lucide="x" class="w-4 h-4"></i></button>
        </div>
        <p class="text-xs text-slate-500 mb-3 leading-relaxed">每五分鐘檢查策略訊號，VIP 取消每日三筆上限；不是逐筆即時行情，不保證獲利。</p>
        <div class="bg-amber-50/60 border border-amber-100 rounded-lg p-2.5 mb-3 text-xs">
          <div class="font-bold text-amber-900 mb-1">VIP 專屬權益：</div>
          <ul class="text-amber-800 space-y-0.5 list-disc list-inside text-[11px]">
            <li>盤中系統原生推播無上限</li>
            <li>後台有更新時顯示反彈觀察清單</li>
            <li>有效突破與爆量訊號提醒</li>
          </ul>
        </div>
        <button id="btn-checkout-now" class="w-full py-2 bg-amber-600 hover:bg-amber-700 text-white rounded-lg text-xs font-bold transition shadow-sm">
          前往訂閱 / 取得序號 (預留通道)
        </button>
      </div>
    </div>

  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
