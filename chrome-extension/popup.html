<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StockWatch Pro</title>
  <link rel="stylesheet" href="assets/popup.css">
</head>
<body class="bg-slate-50 font-sans text-slate-800 antialiased selection:bg-slate-200">
  <div class="w-[400px] max-h-[600px] h-[600px] flex flex-col bg-white border border-slate-200 shadow-xl overflow-hidden relative">

    <!-- 頂部列與搜尋 -->
    <header class="p-3 border-b border-slate-100 bg-white sticky top-0 z-10">
      <div class="flex items-center justify-between mb-2">
        <div class="flex items-center gap-1.5 min-w-0">
          <div id="market-status-dot" class="h-2 w-2 rounded-full bg-slate-400 shrink-0" title="離線 / 休市"></div>
          <h1 id="brand-title" class="text-xs font-bold tracking-tight text-slate-900 truncate">EasyStock · 牛馬自救終端</h1>
          <span id="brand-tag" class="text-[9px] font-mono bg-slate-100 text-slate-500 px-1 py-0.2 rounded border border-slate-200 shrink-0">摸魚中</span>
        </div>
        <div class="flex items-center gap-1.5 shrink-0">
          <button id="btn-stealth-toggle" aria-label="切換牛馬上班摸魚偽裝模式" title="一鍵切換牛馬上班摸魚偽裝模式 (快捷鍵 B)" class="px-1.5 py-0.5 rounded text-[10px] font-medium bg-slate-100 hover:bg-slate-200 text-slate-600 border border-slate-200 flex items-center gap-1 transition">
            <span>🐮</span> <span id="stealth-btn-label">摸魚</span>
          </button>
          <button id="btn-open-settings" aria-label="開啟設定" title="開啟設定面板" class="px-2 py-0.5 rounded text-[11px] font-semibold bg-slate-900 hover:bg-slate-800 text-white flex items-center gap-1 shadow-xs transition active:scale-95 cursor-pointer">
            <i data-lucide="sliders-horizontal" class="w-3.5 h-3.5"></i>
            <span>設定</span>
          </button>
        </div>
      </div>
      <div class="flex items-center gap-1.5 relative">
        <div class="relative flex-1">
          <i data-lucide="search" class="w-3.5 h-3.5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"></i>
          <input id="input-search" aria-label="股票代號或名稱" type="text" autocomplete="off" placeholder="代號/中文 (如 2330 或 台積電)..." class="w-full pl-8 pr-2 py-1 text-xs bg-slate-50 border border-slate-200 rounded-md focus:outline-none focus:border-slate-400" />
          <div id="search-suggestions" class="hidden absolute left-0 right-0 top-full mt-1 bg-white border border-slate-200 rounded-md shadow-lg z-30 max-h-48 overflow-y-auto text-xs py-1"></div>
        </div>
        <button id="btn-add" class="h-7 px-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-md text-xs font-medium flex items-center gap-1 shrink-0">
          <i data-lucide="plus" class="w-3 h-3"></i> 新增
        </button>
      </div>
    </header>

    <!-- 大盤即時加權與櫃買指數 -->
    <div id="taiex-banner" class="flex items-center justify-between px-3 py-1.5 bg-slate-50 border-b border-slate-100 text-[11px]">
      <div class="flex items-center gap-1.5 min-w-0">
        <span class="font-bold text-slate-700">加權指數</span>
        <span id="taiex-price" class="font-bold text-slate-900">-</span>
        <span id="taiex-change" class="font-semibold text-slate-500">-</span>
      </div>
      <div id="otc-container" class="flex items-center gap-1 text-[10px] text-slate-500 shrink-0">
        <span>櫃買</span>
        <span id="otc-price" class="font-medium text-slate-700">-</span>
        <span id="otc-change" class="font-medium">-</span>
      </div>
    </div>

    <!-- 群組切換 Tabs (自選看股與系統策略分流) -->
    <nav id="group-tabs" class="flex px-3 py-1.5 border-b border-slate-100 gap-1 text-xs bg-slate-50/50">
      <button class="tab-btn px-2 py-1 rounded font-medium text-slate-900 bg-white border border-slate-200 shadow-xs" data-group="watchlist">⭐ 自選</button>
      <button class="tab-btn px-2 py-1 rounded font-medium text-slate-500 hover:text-slate-800" data-group="daytrade">🎯 當沖</button>
      <button class="tab-btn px-2 py-1 rounded font-medium text-slate-500 hover:text-slate-800" data-group="rebound">🛡️ 觸底反彈</button>
      <button class="tab-btn px-2 py-1 rounded font-medium text-slate-500 hover:text-slate-800" data-group="ai_matrix">🤖 當沖AI架構</button>
    </nav>

    <!-- 策略標的池與一鍵加入自選 -->
    <section id="strategy-bar" class="hidden px-3 py-2 bg-slate-100/90 border-b border-slate-200 flex items-center justify-between text-xs">
      <div class="flex items-center gap-1.5 min-w-0">
        <span id="strategy-bar-title" class="font-bold text-slate-800 truncate">策略標的</span>
        <span id="strategy-bar-count" class="text-[10px] bg-slate-200 text-slate-700 px-1.5 py-0.5 rounded-full font-semibold">0</span>
      </div>
      <button id="btn-batch-add" class="px-2 py-0.5 bg-sky-600 hover:bg-sky-700 text-white rounded text-[11px] font-semibold flex items-center gap-1 shrink-0 transition">
        <i data-lucide="zap" class="w-3 h-3"></i>
        <span id="btn-batch-add-text">一鍵全部加入自選</span>
      </button>
    </section>

    <!-- 自選列表容器 -->
    <main id="stock-list-container" class="flex-1 overflow-y-auto no-scrollbar p-3 space-y-2">
      <!-- 動態插入卡片 -->
    </main>

    <!-- 底部狀態列 -->
    <footer class="px-3 py-2 bg-slate-50 border-t border-slate-100 flex items-center justify-between text-[11px] text-slate-400">
      <span id="update-timestamp">狀態：就緒</span>
      <div class="flex items-center gap-2">
        <button id="btn-refresh" class="hover:text-slate-600 transition" title="重新整理">
          <i data-lucide="rotate-cw" class="w-3.5 h-3.5"></i>
        </button>
      </div>
    </footer>

    <!-- 設定面板 (Drawer) -->
    <div id="settings-panel" role="dialog" aria-label="擴充功能設定" aria-hidden="true" class="absolute inset-0 bg-white z-20 transform translate-x-full transition-transform duration-200 flex flex-col">
      <div class="p-3 border-b border-slate-100 flex items-center justify-between">
        <h2 class="text-xs font-bold text-slate-900">擴充功能設定</h2>
        <button id="btn-close-settings" aria-label="關閉設定" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-4 h-4"></i>
        </button>
      </div>
      <div class="flex-1 overflow-y-auto p-3 space-y-4 text-xs">
        <p id="action-message" role="status" aria-live="polite" class="text-[11px] text-slate-500"></p>

        <!-- 牛馬專屬摸魚偽裝模式 -->
        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
          <label class="flex items-center justify-between cursor-pointer">
            <div>
              <span class="font-bold text-slate-800 flex items-center gap-1">
                <span>🐮</span> <span>牛馬上班摸魚偽裝模式</span>
              </span>
              <span class="block text-[10px] text-slate-500">淡化刺眼紅綠盤面，標題偽裝成系統指標 (快捷鍵 B)</span>
            </div>
            <input type="checkbox" id="toggle-stealth" class="rounded text-slate-900 cursor-pointer" />
          </label>
        </div>

        <!-- 測試與推播專用區 (VM / 除錯用) -->
        <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200">
          <h3 class="font-bold text-slate-800 mb-1 flex items-center gap-1">
            <i data-lucide="bell-ring" class="w-3.5 h-3.5 text-sky-600"></i>
            <span>原生推播測試 (Telegram 格式)</span>
          </h3>
          <p class="text-[10px] text-slate-500 mb-2">點擊發送系統通知，測試買進／賣出彈窗與音效設定。</p>
          <div class="grid grid-cols-2 gap-2 mb-2">
            <button id="btn-test-daytrade-notif" class="py-1 bg-sky-600 hover:bg-sky-700 text-white rounded text-[11px] font-medium transition">
              🚀 測試買進推播
            </button>
            <button id="btn-test-exit-notif" class="py-1 bg-emerald-600 hover:bg-emerald-700 text-white rounded text-[11px] font-medium transition">
              ✅ 測試賣出推播
            </button>
          </div>
          <button id="btn-test-rebound-notif" class="w-full py-1 bg-purple-600 hover:bg-purple-700 text-white rounded text-[11px] font-medium transition">
            測試反彈推播
          </button>
        </div>

        <!-- 策略開關 -->
        <div>
          <h3 class="font-bold text-slate-700 mb-2">推播開關設定</h3>
          <div class="space-y-2">
            <label class="flex items-center justify-between">
              <div>
                <span class="font-medium text-slate-800">當沖推播提醒</span>
                <span class="block text-[10px] text-slate-400">當沖進場（買進）與出場（賣出）桌面通知</span>
              </div>
              <input type="checkbox" id="toggle-daytrade" class="rounded text-slate-900" />
            </label>
            <label class="flex items-center justify-between pl-2 border-l-2 border-sky-200">
              <div>
                <span>全市場當沖連動</span>
                <span class="block text-[10px] text-slate-400">不限自選清單，自動接收全市場當沖部位</span>
              </div>
              <input type="checkbox" id="toggle-all-daytrade" class="rounded text-slate-900" />
            </label>

            <div class="pt-1 border-t border-slate-100"></div>

            <label class="flex items-center justify-between">
              <div>
                <span class="font-medium text-slate-800">觸底反彈推播提醒</span>
                <span class="block text-[10px] text-slate-400">技術面支撐區反彈與量能回升推播</span>
              </div>
              <input type="checkbox" id="toggle-rebound" class="rounded text-slate-900" />
            </label>
            <label class="flex items-center justify-between pl-2 border-l-2 border-purple-200">
              <div>
                <span>全市場反彈連動</span>
                <span class="block text-[10px] text-slate-400">不限自選清單，自動接收全市場反彈股</span>
              </div>
              <input type="checkbox" id="toggle-all-rebound" class="rounded text-slate-900" />
            </label>
          </div>
        </div>

        <!-- 條件式推播過濾 -->
        <div class="border-t border-slate-100 pt-3">
          <h3 class="font-bold text-slate-700 mb-1 flex items-center justify-between">
            <span>條件式推播過濾</span>
            <span id="filter-status-tag" class="text-[10px] text-sky-600 bg-sky-50 px-1 rounded">全開模式</span>
          </h3>
          <p class="text-[10px] text-slate-400 mb-2">可限制推播價格區間與漲幅門檻，或選擇全開。</p>
          
          <div class="space-y-2 bg-slate-50 p-2 rounded-lg border border-slate-200">
            <div class="flex items-center gap-4 text-[11px]">
              <label class="flex items-center gap-1 cursor-pointer">
                <input type="radio" name="filter-mode" id="radio-filter-all" value="all" checked />
                <span>全開 (全部推播)</span>
              </label>
              <label class="flex items-center gap-1 cursor-pointer">
                <input type="radio" name="filter-mode" id="radio-filter-custom" value="custom" />
                <span>條件過濾</span>
              </label>
            </div>

            <div id="custom-filter-fields" class="space-y-1.5 pt-1 text-[11px]">
              <div class="flex items-center gap-2">
                <span class="w-16 text-slate-500">價格區間:</span>
                <input type="number" id="input-min-price" placeholder="最低價" class="w-20 px-1.5 py-0.5 bg-white border border-slate-200 rounded text-xs" />
                <span>~</span>
                <input type="number" id="input-max-price" placeholder="最高價" class="w-20 px-1.5 py-0.5 bg-white border border-slate-200 rounded text-xs" />
                <span class="text-slate-400">元</span>
              </div>
              <div class="flex items-center gap-2">
                <span class="w-16 text-slate-500">漲幅超過:</span>
                <input type="number" step="0.1" id="input-min-pct" placeholder="如: 2.0" class="w-20 px-1.5 py-0.5 bg-white border border-slate-200 rounded text-xs" />
                <span class="text-slate-400">% (例如 2% 才推播)</span>
              </div>
              <button id="btn-save-filter" class="w-full mt-1 py-1 bg-slate-800 hover:bg-slate-900 text-white rounded font-medium text-[11px]">
                儲存條件設定
              </button>
            </div>
          </div>
        </div>

        <!-- 摸魚排版與卡片自定義 -->
        <div class="border-t border-slate-100 pt-3">
          <div class="bg-slate-50 p-2.5 rounded-lg border border-slate-200 space-y-2">
            <h3 class="font-bold text-slate-800 flex items-center justify-between">
              <span class="flex items-center gap-1"><span>📐</span> <span>摸魚排版與卡片自定義</span></span>
              <span id="density-status-tag" class="text-[10px] text-sky-600 bg-sky-50 px-1 rounded font-medium">一頁 5 筆</span>
            </h3>
            <p class="text-[10px] text-slate-400">自定義方框大小與一頁筆數，上班縮小看盤摸魚不顯眼。</p>
            
            <div class="space-y-2 text-[11px]">
              <div class="flex items-center justify-between">
                <span class="text-slate-600">一頁顯示筆數 (3~10 筆):</span>
                <div class="flex items-center gap-1.5">
                  <input type="range" id="range-page-size" min="3" max="10" step="1" value="5" class="w-24 accent-slate-900 cursor-pointer" />
                  <span id="range-page-size-val" class="w-6 text-center font-bold text-slate-800 text-xs">5</span>
                </div>
              </div>

              <div class="flex items-center justify-between pt-1 border-t border-slate-200">
                <span class="text-slate-600">方框摸魚緊湊度:</span>
                <div class="flex items-center gap-2">
                  <label class="flex items-center gap-1 cursor-pointer">
                    <input type="radio" name="card-density" id="radio-density-normal" value="normal" />
                    <span>標準</span>
                  </label>
                  <label class="flex items-center gap-1 cursor-pointer">
                    <input type="radio" name="card-density" id="radio-density-compact" value="compact" checked />
                    <span>極簡緊湊</span>
                  </label>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- 自選清單備份 -->
        <div class="border-t border-slate-100 pt-3">
          <h3 class="font-bold text-slate-700 mb-2">資料備份與還原</h3>
          <div class="flex gap-2">
            <button id="btn-export-stocks" class="flex-1 py-1 border border-slate-200 rounded hover:bg-slate-50">匯出 JSON</button>
            <button id="btn-import-stocks" class="flex-1 py-1 border border-slate-200 rounded hover:bg-slate-50">匯入 JSON</button>
            <input type="file" id="file-import" class="hidden" accept=".json" />
          </div>
        </div>
      </div>
    </div>

  </div>
  <script type="module" src="popup.js"></script>
</body>
</html>
