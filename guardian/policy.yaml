  "sensitive_patterns": {
    "extensions": [
      ".p12",
      ".pfx",
      ".pem",
      ".key",
      ".sqlite",
      ".sqlite3",
      ".db",
      ".tar.gz",
      ".tgz",
      ".zip",
      ".bundle"
    ],
    "names": [
      "firebase-service-account.json",
      "credentials.json"
    ],
    "placeholder": "(?i)^(?:|change[-_ ]?me|your[_ -].*|example.*|placeholder.*|test[-_].*|fake[-_].*|[xX*]+)$",
    "tokens": [
      "-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----",
      "(?:sk-(?:proj-)?[A-Za-z0-9_-]{24,})",
      "(?:gh[pousr]_[A-Za-z0-9]{30,})",
      "(?:github_pat_[A-Za-z0-9_]{30,})",
      "(?:eyJ[A-Za-z0-9_-]{12,}\\.[A-Za-z0-9_-]{12,}\\.[A-Za-z0-9_-]{12,})",
      "(?:[0-9]{7,12}:[A-Za-z0-9_-]{30,})"
    ],
    "key_names": "(?i)(api[_-]?key|secret|password|private_key|access_token|bot_token|ca_passwd|national_id|person_id)"
  },
  "public_exposure_rules": {
    "sensitive_fields": [
      "national_id",
      "person_id",
      "api_key",
      "secret",
      "password",
      "private_key",
      "access_token",
      "ca_path",
      "certificate_path",
      "broker_account", "account_id", "stack_trace", "stacktrace"
    ],
    "private_infrastructure": "(?:https?://[^\\s\\\"'<>]*\\.(?:ngrok-free\\.(?:app|dev)|ngrok\\.io)|https?://(?:[0-9]{1,3}\\.){3}[0-9]{1,3}(?::[0-9]+)?)"
  },
  "baseline_allowed": [
    "MEDIUM",
    "LOW"
  ]
