name: easystock-antigravity
services:
  easystock-antigravity:
    container_name: easystock-antigravity
    platform: linux/arm64
    build:
      context: .
    image: easystock-antigravity:1.2.16
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: Asia/Taipei
      GITHUB_AUTH_MODE: ${GITHUB_AUTH_MODE:-ssh}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:?Set GIT_AUTHOR_NAME in .env}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:?Set GIT_AUTHOR_EMAIL in .env}
      AGY_INSTANCE_NAME: ${AGY_INSTANCE_NAME:-EasyStock-NAS}
    volumes:
      - agent-home:/home/agent
      - agent-workspace:/workspace
      - type: bind
        source: ${GITHUB_AUTH_DIR:?Set absolute GITHUB_AUTH_DIR in .env}
        target: /run/github
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    healthcheck:
      test: [CMD-SHELL, 'test -s /tmp/antigravity-daemon.pid && kill -0 "$$(cat /tmp/antigravity-daemon.pid)"']
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
volumes:
  agent-home:
  agent-workspace:
