services:
  easystock-nas-backup:
    build: .
    image: easystock-nas-backup:local
    environment:
      TZ: Asia/Taipei
      NAS_CONFIG: /config/nas.env
    volumes:
      - /data/backup/vm:/data/backup/vm
      - /workspace/.ssh:/workspace/.ssh:ro
      - ./nas.env:/config/nas.env:ro
    command: ["/opt/easystock/ops/nas/sync_from_vm.sh"]
