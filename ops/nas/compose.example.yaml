services:
  easystock-nas-backup:
    build: .
    image: easystock-nas-backup:local
    environment:
      TZ: Asia/Taipei
      NAS_CONFIG: /config/nas.env
    volumes:
      - /data/backup/vm:/data/backup/vm
      - /data/backup/orderbook:/data/backup/orderbook
      - /workspace/.ssh:/workspace/.ssh:ro
      - ./nas.env:/config/nas.env:ro
    command: ["/opt/easystock/ops/nas/sync_from_vm.sh"]
    healthcheck:
      disable: true
  easystock-scheduler:
    build: .
    image: easystock-nas-backup:local
    container_name: easystock-scheduler
    restart: unless-stopped
    environment:
      TZ: Asia/Taipei
      NAS_CONFIG: /config/nas.env
    volumes:
      - /data/backup/vm:/data/backup/vm
      - /data/backup/orderbook:/data/backup/orderbook
      - /workspace/.ssh:/workspace/.ssh:ro
      - ./nas.env:/config/nas.env:ro
    command: ["/usr/sbin/cron", "-f"]
