name: easystock-codex

services:
  easystock-codex:
    container_name: easystock-codex
    platform: linux/arm64
    build:
      context: .
    image: easystock-codex:latest
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      TZ: ${TZ:-Asia/Taipei}
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:?Set GIT_AUTHOR_NAME in .env}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:?Set GIT_AUTHOR_EMAIL in .env}
    volumes:
      - codex-home:/home/codex
      - codex-workspace:/workspace
      - type: bind
        source: ${GITHUB_AUTH_DIR:?Set absolute GITHUB_AUTH_DIR in .env}
        target: /run/github
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  codex-home:
  codex-workspace:
