name: Offline Regression Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: "10"
      - run: python -m pip install -r requirements.txt -r daytrade_learning/requirements.txt python-dotenv Flask
      - run: python tests/test_parsers.py
      - run: python tests/test_selection.py
      - run: python tests/test_market_calendar.py
      - run: python tests/test_range_rebound.py
      - run: python tests/test_ai_history_audit.py
      - run: python tests/test_paper_legacy.py
      - run: python tests/test_research_schedule.py
      - run: python daytrade_learning/test_core.py
      - run: python tests/test_premarket_entry.py
      - run: python tests/test_verify_intraday_runtime.py
      - run: python vm_runtime/tests/test_cash_ledger.py
      - run: python history/test_daily_history.py
      - run: python tests/test_market_risk_gate.py
      - run: python vm_runtime/tests/test_runtime_safety.py
      - run: bash -n deploy/switch_vm_runtime.sh
      - run: python vm_runtime/daytrade_learning/test_integration.py
      - run: python vm_runtime/daytrade_learning/test_eod_fix.py
      - run: python vm_runtime/easystock_admin/test_admin.py
      - run: python vm_runtime/easystock_admin/test_conversations.py
      - run: python vm_runtime/easystock_admin/test_notifications.py
      - run: python vm_runtime/easystock_admin/test_telegram_queries.py
      - run: python vm_runtime/history/test_daily_history.py
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm test
      - run: node tests/test_admin_ui.cjs
      - run: node tests/test_asset_versions.cjs
      - name: Install Chrome extension build dependencies
        run: pnpm --dir chrome-extension install --frozen-lockfile --ignore-scripts
      - name: Build production and isolated VM extension packages
        run: pnpm --dir chrome-extension build
      - name: Test extension state, notification, and UI behavior
        run: pnpm --dir chrome-extension test

      - name: Upload Chrome Web Store 1.05 package
        uses: actions/upload-artifact@v4
        with:
          name: easystock-chrome-extension-v1.05-google
          path: chrome-extension/dist/production/*
          if-no-files-found: error
          retention-days: 14
