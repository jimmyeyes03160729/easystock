name: Historical K-line Backfill

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easystock-history-backfill
  cancel-in-progress: false

jobs:
  backfill:
    name: shard-${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]

    env:
      PYTHONUNBUFFERED: "1"
      FIREBASE_ROOT_PATH: market_data
      KLINE_DAYS: "250"
      HISTORY_MONTHS: "14"
      TARGET_MIN_BARS: "220"
      HISTORY_HTTP_TIMEOUT: "12"
      HISTORY_HTTP_WORKERS: "3"
      SHARD_COUNT: "5"
      SHARD_INDEX: ${{ matrix.shard }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Validate Firebase Secrets
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          test -n "$FIREBASE_DATABASE_URL" || (echo "::error::Missing FIREBASE_DATABASE_URL" && exit 1)
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON" && exit 1)
          python - <<'PY'
          import json, os
          json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"])
          print("Firebase secrets OK")
          PY

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m py_compile backfill_history.py

      - name: Backfill Historical K-lines
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: python backfill_history.py
