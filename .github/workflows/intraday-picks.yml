name: Intraday & Overnight Picks

on:
  schedule:
    # Taiwan time (UTC+8): 09:30, 10:00, 11:00, 12:00, 13:00, 13:20, Mon-Fri
    - cron: "30 1 * * 1-5"
    - cron: "0 2 * * 1-5"
    - cron: "0 3 * * 1-5"
    - cron: "0 4 * * 1-5"
    - cron: "0 5 * * 1-5"
    - cron: "20 5 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easystock-intraday-picks
  cancel-in-progress: true

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONUNBUFFERED: "1"
      FIREBASE_ROOT_PATH: "market_data"
      HTTP_TIMEOUT: "12"
      INTRADAY_SCAN_MAX_SYMBOLS: "30"
      INTRADAY_TOP_N: "3"
      INTRADAY_MIN_DAYTRADE_SCORE: "76"
      INTRADAY_MIN_OVERNIGHT_SCORE: "74"
      FUGLE_MIN_INTERVAL_SECONDS: "1.10"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate Secrets
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          test -n "$FIREBASE_DATABASE_URL" || (echo "::error::Missing FIREBASE_DATABASE_URL" && exit 1)
          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON" && exit 1)
          test -n "$FUGLE_API_KEY" || (echo "::error::Missing FUGLE_API_KEY" && exit 1)
          python - <<'PY'
          import json, os
          json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"])
          print("Secrets validation OK (values hidden).")
          PY

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify Scanner Syntax
        run: |
          python -m py_compile scan_intraday.py

      - name: Scan Fugle 5m / 15m Patterns
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: python scan_intraday.py
