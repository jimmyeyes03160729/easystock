name: Overnight Picks - Legacy Fugle

on:
  schedule:
    # Taiwan 13:05 / 13:15 preview, 13:42 completed-session research.
    # GitHub may delay jobs: scanner verifies actual clock and candle age.
    - cron: "5,15,42 5 * * 1-5"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: easystock-overnight-picks
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      PYTHONUNBUFFERED: "1"
      FIREBASE_ROOT_PATH: "market_data"
      HTTP_TIMEOUT: "12"
      INTRADAY_SCAN_MAX_SYMBOLS: "50"
      INTRADAY_TOP_N: "3"

      # 舊 Fugle 當沖完全關閉
      INTRADAY_ENABLE_DAYTRADE: "0"
      INTRADAY_ENABLE_OVERNIGHT: "1"

      INTRADAY_MIN_DAYTRADE_SCORE: "76"
      INTRADAY_MIN_OVERNIGHT_SCORE: "74"
      FUGLE_MIN_INTERVAL_SECONDS: "1.10"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Validate Secrets
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          test -n "$FIREBASE_DATABASE_URL" || (
            echo "::error::Missing FIREBASE_DATABASE_URL"
            exit 1
          )

          test -n "$FIREBASE_SERVICE_ACCOUNT_JSON" || (
            echo "::error::Missing FIREBASE_SERVICE_ACCOUNT_JSON"
            exit 1
          )

          test -n "$FUGLE_API_KEY" || (
            echo "::error::Missing FUGLE_API_KEY"
            exit 1
          )

          python - <<'PY'
          import json
          import os
          json.loads(os.environ["FIREBASE_SERVICE_ACCOUNT_JSON"])
          print("Secrets validation OK (values hidden).")
          PY

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify Scanner Syntax
        run: |
          python -m py_compile scan_intraday.py

      - name: Scan Overnight Fugle Patterns
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          FUGLE_API_KEY: ${{ secrets.FUGLE_API_KEY }}
        run: |
          echo "Legacy DAYTRADE: disabled"
          echo "OVERNIGHT: enabled"
          python scan_intraday.py
