cost_and_execution_spec:
  canonical_cost_model:
    base_commission_reference_rate: 0.001425
    broker_discount: 0.28
    minimum_fee: 20.0
    daytrade_tax_rate: 0.0015
  canonical_slippage_grid_ticks: [0, 1, 2, 3]
  execution_clock_safety_buffer_seconds: 2
  walk_forward_splitter:
    type: "EventWalkForwardSplitter"
    n_splits: 5
    purge_overlaps: true
    embargo_days: 1

filter_specifications:
  F01_MARKET_REGIME:
    data_source: "UNIVERSE_EQUAL_WEIGHTED_MARKET_PROXY"
    is_proxy: true
    is_official_index: false
    leave_one_out: true
    missing_constituent_policy: "EXCLUDE_FROM_CURRENT_CROSS_SECTION"
    conditions:
      - name: "UNIVERSE_PROXY_INTRADAY_DIRECTION"
        rule: "LONG requires proxy_intraday_return >= 0.0; SHORT requires <= 0.0"
      - name: "UNIVERSE_PROXY_TREND_ALIGNMENT"
        rule: "LONG requires proxy_trend_slope_15m >= 0.0; SHORT requires <= 0.0"
    ranking_eligible: true

  F02_RELATIVE_STRENGTH:
    benchmark: "LEAVE_ONE_OUT_MARKET_PROXY"
    windows_minutes: [5, 15, 30, 60]
    neutral_band: 0.001
    conditions:
      - name: "RS_NON_ADVERSE"
        rule: "LONG requires tier in (POSITIVE, NEUTRAL); SHORT requires tier in (NEGATIVE, NEUTRAL)"
      - name: "RS_STRICT_POSITIVE_NEGATIVE"
        rule: "LONG requires tier == POSITIVE; SHORT requires tier == NEGATIVE"
    ranking_eligible: true

  F03_SECTOR_STRENGTH:
    status: "DATA_INSUFFICIENT"
    point_in_time_sector_mapping: false
    ranking_eligible: false
    treatment: "EXCLUDED_FROM_PERFORMANCE_RANKING_PRESERVES_UNFILTERED"

  F04_HIGHER_TIMEFRAME_CONTEXT:
    aggregation: "STRICTLY_CLOSED_BARS_ONLY"
    timeframes: ["5m", "15m", "30m"]
    conditions:
      - name: "LAST_CLOSED_HTF_BAR_DIRECTION"
        rule: "LONG requires last closed HTF bar close >= open; SHORT requires close <= open"
      - name: "LAST_CLOSED_HTF_VWAP"
        rule: "LONG requires last closed HTF bar close >= HTF VWAP; SHORT requires <= HTF VWAP"
    ranking_eligible: true

  F05_LIQUIDITY_CANDIDATE_POOL:
    traded_value_source: "ARCHIVE_AMOUNT_PRIMARY"
    lookback_minutes: [30, 60]
    min_rolling_traded_value_twd: [10000000.0, 20000000.0, 50000000.0]
    ranking_eligible: true

pairwise_combinations_pre_registered:
  scope: "EXPLORATORY_POST_SMOKE"
  confirmatory_status: false
  ranking_eligible: false
  promotion_eligible: false
  governance_rule: "EXPLORATORY ONLY. Single filters must show positive edge first. Pairwise cannot cherry-pick combinations to promote candidates if single filters are negative."
  pairs:
    - id: "PAIR_01_F01_F02"
      filter_a: "F01_REGIME_INTRADAY_DIRECTION"
      filter_b: "F02_RELATIVE_STRENGTH_15M"
      rationale: "Aligns macro cross-sectional market direction with individual stock relative momentum."

    - id: "PAIR_02_F01_F04"
      filter_a: "F01_REGIME_INTRADAY_DIRECTION"
      filter_b: "F04_HTF_5M_DIRECTION"
      rationale: "Tests multi-timeframe concurrence: market proxy daily direction + stock 5m closed bar trend."

    - id: "PAIR_03_F01_F05"
      filter_a: "F01_REGIME_INTRADAY_DIRECTION"
      filter_b: "F05_LIQUIDITY_30M"
      rationale: "Filters for high-liquidity stock episodes under aligned market direction."

    - id: "PAIR_04_F02_F05"
      filter_a: "F02_RELATIVE_STRENGTH_15M"
      filter_b: "F05_LIQUIDITY_30M"
      rationale: "Tests whether stock-specific relative alpha is concentrated in high-liquidity episodes."

prohibitions:
  cartesian_product_search: false
  unregistered_filter_mining: false
  oos_tuning: false
  promote_to_production: false
