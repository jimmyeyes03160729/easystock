  dataset_snapshot_id: "2026-09-10_FROZEN_100_STOCK_POOL"
  plan_status: "PRE_REGISTERED_FROZEN"
  freeze: true
  governance: "STRICT_RESEARCH_ONLY_INERT_BY_DEFAULT"
  scopes:
    confirmatory_scope:
      - "F01_MARKET_REGIME"
      - "F02_RELATIVE_STRENGTH"
