# EasyStock Research Governance — Objective Function Specification v1
# Specification of allowable evaluation objectives, parameter selection criteria,
# and optimization boundaries under Pardo walk-forward evaluation.

spec_metadata:
  spec_name: "OBJECTIVE_FUNCTION_SPEC"
  spec_version: "1.0.0"
  created_at: "2026-10-03T22:20:00+08:00"
  status: "RESEARCH_GOVERNANCE"
  production_effect: "NONE"

governance_invariants:
  freeze_before_search: true
  train_only_selection: true
  oos_selection_allowed: false
  robust_region_required: true
  post_hoc_objective_change_allowed: false

design_principles:
  pardo_doctrine: >
    In a valid Walk-Forward Analysis (Pardo, 2008), model selection and parameter
    optimization are strictly restricted to the in-sample (Train) partition. The
    out-of-sample (Test/OOS) partition is reserved solely for unbiased performance
    measurement. Selecting parameters based on OOS metrics or switching objective
    functions after observing OOS performance constitutes fatal data snooping.

  robust_plateau_requirement: >
    Optimal parameters chosen in-sample must reside in a broad, stable parameter
    neighborhood (plateau) rather than an isolated spike. Parameter sensitivity
    testing is mandatory before promoting any candidate parameter set.

allowed_primary_metrics:
  NET_RETURN_PCT:
    metric_id: "delta_net_return_pct"
    description: "Difference in net return percentage between filtered and unfiltered trades"
    direction: "MAXIMIZE"
    accounting_formula: "net_return_pct = theoretical_return_pct - trading_friction_pct"
    unit: "PERCENTAGE"

  NET_EXPECTANCY_R:
    metric_id: "delta_net_expectancy_R"
    description: "Difference in net expectancy expressed in initial risk multiples (R)"
    direction: "MAXIMIZE"
    unit: "R_MULTIPLE"

  PROFIT_FACTOR:
    metric_id: "filtered_profit_factor"
    description: "Ratio of gross profit to gross loss on filtered trades"
    direction: "MAXIMIZE"
    minimum_threshold: 1.05

eligibility_gates:
  implementation_integrity:
    description: "Code complete, causal execution verified, static AST production isolation passed"
    mandatory: true
  accounting_integrity:
    description: "Single source of truth slippage and transaction costs applied without double-counting"
    mandatory: true
  sample_adequacy:
    description: "Minimum trade counts across evaluated stock-days satisfying statistical validity"
    mandatory: true
  risk_constraints:
    description: "Finite positive stop distance; invalid stop or zero-risk R strictly rejected"
    mandatory: true
  causal_data_integrity:
    description: "Strict bar time semantics and purge/embargo overlap quarantine enforced"
    mandatory: true
  parameter_robustness:
    description: "Performance persists across neighboring parameter values without isolated spikes"
    mandatory: true
  concentration_audit:
    description: "Performance must not be driven by an extreme outlier date, single stock, or ticker subset"
    mandatory: true

selection:
  select_global_best_point: false
  robust_region_required: true
  representative_selector: "PREREGISTERED"
  no_robust_region_action: "NO_SELECTION"

secondary_profile:
  sample_count:
    description: "Total evaluated trade count in partition"
  trade_frequency:
    description: "Average trades per trading day"
  theoretical_return:
    description: "Gross return before slippage and commission"
  trading_friction:
    description: "Aggregate transaction costs and slippage drag"
  net_return:
    description: "Realized net return after full frictional accounting"
  net_expectancy:
    description: "Net expectancy in R-multiples"
  win_rate:
    description: "Fraction of closed trades with positive net PnL"
  profit_factor:
    description: "Gross winning amount divided by gross losing amount"
  maximum_drawdown:
    description: "Maximum peak-to-trough decline in net equity"
  temporal_stability:
    description: "Consistency of metric across chronological sub-periods or WFA folds"
  cross_sectional_stability:
    description: "Consistency of metric across symbol liquidity tiers"
  concentration:
    description: "Fraction of total net PnL generated by top 5% of trades or dates"

oos_policy:
  evaluate_only: true
  tuning_allowed: false
  threshold_change_allowed: false
  objective_change_allowed: false

disallowed_practices:
  - "OOS_PARAMETER_TUNING: Optimizing or tuning parameters to improve OOS metrics"
  - "POST_HOC_OBJECTIVE_SWITCHING: Changing evaluation metrics after observing results"
  - "ISOLATED_PEAK_SELECTION: Selecting an optimal point without verifying neighboring points"
  - "LABEL_LEAKAGE: Utilizing future information across fold boundaries"
  - "SILENT_DROPPING: Omitting failed parameter trials from the research ledger"
