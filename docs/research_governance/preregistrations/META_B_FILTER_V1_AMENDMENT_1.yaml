# META_B_FILTER_V1 Amendment 1 — early-session returns and implementation details (2026-10-09)
# Made BEFORE any META_B_FILTER_V1 outcome was computed or viewed.

amends: "docs/research_governance/preregistrations/META_B_FILTER_V1.yaml"
created_at: "2026-10-09T00:30:00+08:00"
reason: >
  A runtime smoke run of the worker on one training-period day (2024-06-04, before every FOLD_WINDOW) showed that
  return_15m_pct is undefined for every decision before 09:15 (no trade 15 minutes earlier). Under the frozen
  missing-feature rule the filter could then never accept B's ORB candidates from 09:05 to 09:15. Only counts,
  run time, memory and which features were missing were viewed; no return, label or trade result.

changes:
  return_5m_pct_and_return_15m_pct:
    was: "price / latest trade at or before t - h, minus 1"
    now: "same, but when no trade exists at or before t - h, the reference is the session's first trade (at or after 09:00), i.e. the return since the open over less than h"

clarifications:
  radar_thresholds: >
    intraday_live reads its radar thresholds from the environment at import. The study pins the values of the VM
    service environment (/home/ubuntu/easystock/.env, read 2026-10-08): LIVE_RADAR_MIN_60S_VOLUME=10,
    LIVE_RADAR_MIN_60S_AMOUNT=1500000, LIVE_RADAR_MIN_SURGE=1.4, LIVE_RADAR_MIN_BUY_RATIO=0.52,
    LIVE_RADAR_MIN_CLASSIFIED_RATIO=0.35, LIVE_RADAR_MIN_PRICE_CHANGE_60_PCT=-0.10; history 420 s and 4 baseline
    windows are the code defaults. The file was modified on 2026-10-08, so the 2026-10-02 values are unverified;
    these are the settings runway B runs with from 2026-10-12.
  radar_top_n: "30 (canonical_policy carries no radar cap; RADAR_TOP_N and the admin max_recommendations default are both 30)"
  pinned_rule_files: "runway_v2 strategy/config/orderbook/manager at 6aa1e5a are vendored byte-identical under research/meta_b_filter_v1/pinned/ (git show; blob hashes verified at run time, run aborts on mismatch)"
  session_open: "open of the first archived 1m bar, usable only once that bar has completed"
  not_estimable: "the 300-event / 30-positive minimum counts training events with all 19 features present"
  inner_threshold_fallback: "if the inner 75% split has a single label class or the inner validation split is empty, tau = 0.50"
  portfolio_loss_stop: "a position's net TWD is realized at its final exit for the 6,000 TWD stop (the profitable half leg is not realized early, which is conservative)"
  run_environment: "/home/ubuntu/easystock-learning-venv (numpy 2.2.6, scikit-learn 1.7.2), two niced workers, from a git archive of the merged commit"

unchanged:
  - "candidate generator, decision grid, exits, fills, costs, label, model, threshold rule, folds, criteria A-E and G, classification, Stage 2"
